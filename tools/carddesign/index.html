<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卡面制作工具</title>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8181303774570877" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://unpkg.com/gitalk/dist/gitalk.css">
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: #f4f6fa; color: #192235; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1600px; margin: 0 auto; padding: 32px 24px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
    .language-toggle { min-width: 92px; border: 1px solid #cfd8e7; border-radius: 999px; padding: 8px 15px; color: #31527f; background: #fff; font-weight: 600; }
    .language-toggle:hover { border-color: #6d87b8; background: #f7f9fd; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 316px; grid-template-areas: "wallpapers preview controls"; gap: 22px; align-items: start; }
    .panel { background: #fff; border: 1px solid #e4e9f1; border-radius: 16px; box-shadow: 0 9px 32px #1b2e5b0b; }
    .wallpaper-panel { grid-area: wallpapers; position: sticky; top: 18px; max-height: calc(100vh - 36px); padding: 16px 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .wallpaper-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 4px; }
    .wallpaper-heading span { color: #8490a3; font-size: 12px; }
    .wallpaper-list { min-height: 180px; overflow-y: auto; display: grid; gap: 10px; padding-right: 4px; scrollbar-gutter: stable; }
    .wallpaper-option { width: 100%; padding: 5px; border: 2px solid transparent; border-radius: 11px; background: #f3f6fa; color: #526079; text-align: left; transition: border-color .15s, background .15s; }
    .wallpaper-option:hover { border-color: #a8b9d6; background: #edf3fc; }
    .wallpaper-option.active { border-color: #2f62be; background: #edf4ff; }
    .wallpaper-option img { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 7px; object-fit: cover; background: #dfe6f0; }
    .wallpaper-option span { display: block; padding: 6px 3px 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .wallpaper-list-status { margin: auto 4px; color: #8490a3; font-size: 12px; line-height: 1.6; text-align: center; }
    .preview-panel { grid-area: preview; padding: 24px; }
    .preview-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .preview-top strong { font-size: 16px; }
    .size-tag { font-size: 12px; color: #63718a; background: #eef2f8; padding: 7px 10px; border-radius: 8px; }
    .canvas-wrap { max-width: 900px; margin: 0 auto; border-radius: 26px; overflow: hidden; box-shadow: 0 23px 54px #1c2c5260; background: #e1e8f3; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    .hint { margin: 21px 0 0; text-align: center; color: #6e7b92; font-size: 13px; line-height: 1.7; }
    .controls { grid-area: controls; padding: 22px; display: grid; gap: 22px; }
    .section { display: grid; gap: 12px; }
    .section + .section { border-top: 1px solid #edf0f5; padding-top: 20px; }
    h2 { margin: 0; font-size: 15px; }
    .button-row { display: flex; gap: 9px; }
    .button-row > * { flex: 1; }
    .btn { border: 1px solid #d9e1ed; border-radius: 9px; min-height: 39px; padding: 8px 12px; color: #24334c; background: #fff; font-weight: 600; text-align: center; }
    .btn:hover { border-color: #6d87b8; background: #f7f9fd; }
    .btn.active { border-color: #2f62be; color: #2456ad; background: #edf4ff; }
    .btn.primary { border-color: #2659b6; color: #fff; background: #2659b6; }
    .btn.primary:hover { background: #194da9; }
    .btn:disabled { cursor: not-allowed; opacity: .48; }
    .upload { display: block; }
    .upload input { display: none; }
    .upload .btn { display: block; }
    label.field { display: grid; gap: 7px; font-size: 13px; color: #526079; }
    .field[hidden] { display: none; }
    .field-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .field-line output { font-variant-numeric: tabular-nums; color: #26354f; }
    input[type="range"] { width: 100%; accent-color: #2659b6; }
    input[type="number"], input[type="text"] { width: 100%; border: 1px solid #d9e1ed; border-radius: 9px; padding: 9px 11px; outline: none; }
    input[type="number"]:focus, input[type="text"]:focus { border-color: #3972d2; }
    input[type="color"] { width: 48px; height: 34px; padding: 2px; border: 1px solid #d9e1ed; border-radius: 7px; background: #fff; }
    .muted { margin: 0; color: #8490a3; font-size: 12px; line-height: 1.55; }
    .status { min-height: 18px; margin: 0; color: #345e9e; font-size: 12px; }
    .selected-controls[hidden] { display: none; }
    .selected-controls { display: grid; gap: 12px; }
    .selected-title { color: #61718d; font-size: 13px; }
    .ad-container { width: 100%; min-height: 90px; margin-top: 24px; overflow: hidden; text-align: center; }
    .comments-panel { margin-top: 24px; padding: 24px; }
    .comments-panel > h2 { margin-bottom: 18px; font-size: 18px; }
    .page-footer { margin-top: 18px; color: #8490a3; font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
    @media (max-width: 1180px) { .layout { grid-template-columns: 210px minmax(0, 1fr); grid-template-areas: "wallpapers preview" "wallpapers controls"; } .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); } .section + .section { border-top: 0; padding-top: 0; } }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; grid-template-areas: "wallpapers" "preview" "controls"; } .wallpaper-panel { position: static; max-height: 340px; } .wallpaper-list { grid-template-columns: repeat(3, minmax(145px, 1fr)); } .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 590px) { .app { padding: 20px 14px 32px; } h1 { font-size: 22px; } .layout { gap: 14px; } .wallpaper-list { grid-template-columns: repeat(2, minmax(130px, 1fr)); } .preview-panel { padding: 14px; } .controls { grid-template-columns: 1fr; padding: 18px; } .section + .section { border-top: 1px solid #edf0f5; padding-top: 18px; } .canvas-wrap { border-radius: 15px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1 data-i18n="pageTitle">卡面制作工具</h1>
      </div>
      <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch to English">English</button>
    </header>
    <div class="layout">
      <aside class="panel wallpaper-panel" aria-label="Bing 壁纸列表" data-i18n-aria-label="wallpaperPanelAria">
        <div class="wallpaper-heading"><h2 data-i18n="bingWallpapers">Bing 壁纸</h2><span data-i18n="chinaRegion">中国区</span></div>
        <div id="wallpaperList" class="wallpaper-list" role="listbox" aria-label="选择卡片背景" data-i18n-aria-label="chooseBackgroundAria">
          <p class="wallpaper-list-status" data-i18n="loadingWallpapers">正在载入壁纸列表…</p>
        </div>
      </aside>
      <section class="panel preview-panel" aria-label="卡面预览" data-i18n-aria-label="previewPanelAria">
        <div class="preview-top"><strong data-i18n="livePreview">实时预览</strong><span id="sizeTag" class="size-tag">900 × 567 px</span></div>
        <div class="canvas-wrap"><canvas id="card" width="900" height="567" aria-label="卡面编辑画布" data-i18n-aria-label="canvasAria"></canvas></div>
        <p class="hint" data-i18n="canvasHint">拖动背景图片调整位置，手机上可双指缩放；点击文字或标志后可拖动和调整。圆角仅用于预览，导出为完整矩形图片。</p>
      </section>
      <aside class="panel controls" aria-label="编辑工具" data-i18n-aria-label="editingToolsAria">
        <div class="section">
          <h2 data-i18n="sectionSize">1. 卡面尺寸</h2>
          <div class="button-row">
            <button id="bankSize" class="btn active" type="button" data-i18n-html="bankSize">银行卡<br>900 × 567</button>
            <button id="transitSize" class="btn" type="button" data-i18n-html="transitSize">公交卡<br>960 × 606</button>
          </div>
          <p class="muted" data-i18n="sizeNote">尺寸是常见卡面图片预设；若目标应用有明确要求，请以它的要求为准。</p>
        </div>
        <div class="section">
          <h2 data-i18n="sectionBackground">2. 背景图片</h2>
          <label class="upload"><input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg"><span class="btn" data-i18n="uploadBackground">上传背景图片</span></label>
          <label class="field"><span class="field-line"><span data-i18n="imageZoom">图片缩放</span><output id="zoomValue">100%</output></span><input id="zoom" type="range" min="1" max="4" step="0.01" value="1"></label>
          <button id="resetBackground" class="btn" type="button" data-i18n="centerImage">图片居中</button>
        </div>
        <div class="section">
          <h2 data-i18n="sectionContent">3. 添加内容</h2>
          <div class="button-row"><button id="addBus" class="btn" type="button" data-i18n="addBus">＋ 公交</button><button id="addMetro" class="btn" type="button" data-i18n="addMetro">＋ 地铁</button></div>
          <button id="addText" class="btn" type="button" data-i18n="addText">＋ 添加文字</button>
          <label class="upload"><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg"><span class="btn" data-i18n="uploadLogo">上传自备标志</span></label>
          <div id="selectedControls" class="selected-controls" hidden>
            <span id="selectedTitle" class="selected-title"></span>
            <label id="textContentField" class="field" hidden><span data-i18n="textContent">文字内容</span><input id="textContent" type="text" maxlength="80" value="我的卡面"></label>
            <label class="field"><span class="field-line"><span id="sizeLabel">标志宽度</span><output id="logoSizeValue">100 px</output></span><input id="logoSize" type="range" min="30" max="360" step="1" value="100"></label>
            <label id="iconColorField" class="field"><span class="field-line"><span id="colorLabel">图标颜色</span><input id="iconColor" type="color" value="#ffffff"></span></label>
            <button id="removeLogo" class="btn" type="button" data-i18n="removeSelected">删除选中内容</button>
          </div>
        </div>
        <div class="section">
          <h2 data-i18n="sectionExport">4. 导出</h2>
          <button id="exportPng" class="btn primary" type="button" data-i18n="downloadPng">下载 PNG</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p id="backgroundCredit" class="muted">打开页面时自动载入 Bing 每日壁纸；仍可上传图片替换。</p>
        </div>
      </aside>
    </div>
    <div class="ad-container" aria-label="广告" data-i18n-aria-label="advertisementAria">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-8181303774570877"
           data-ad-slot="6631963511"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
    <section class="panel comments-panel" aria-labelledby="commentsTitle">
      <h2 id="commentsTitle" data-i18n="commentsTitle">留言</h2>
      <div id="gitalk-container"></div>
    </section>
    <footer class="page-footer"><span data-i18n="visits">访问次数：</span><span id="busuanzi_page_pv" aria-live="polite">加载中…</span></footer>
  </main>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});

        },

          documentTitle: 'Card Designer', pageTitle: 'Card Designer', languageToggle: '中文', languageToggleAria: '切换到中文',
          wallpaperPanelAria: 'Bing wallpaper list', bingWallpapers: 'Bing Wallpapers', chinaRegion: 'China', chooseBackgroundAria: 'Choose a card background', loadingWallpapers: 'Loading wallpapers…',
          previewPanelAria: 'Card preview', livePreview: 'Live Preview', canvasAria: 'Card editing canvas', canvasHint: 'Drag the background to reposition it; pinch with two fingers to zoom on mobile. Select text or a logo to move and adjust it. Rounded corners are preview-only; exports are full rectangular images.', editingToolsAria: 'Editing tools',

          sectionBackground: '2. Background', uploadBackground: 'Upload Background', imageZoom: 'Image Zoom', centerImage: 'Center Image',
          sectionContent: '3. Add Content', addBus: '＋ Bus', addMetro: '＋ Metro', addText: '＋ Add Text', uploadLogo: 'Upload Custom Logo', textContent: 'Text', removeSelected: 'Delete Selected Item',

          wallpaperListFailed: 'The wallpaper list failed to load. Refresh the page or upload an image.', wallpaperListFailedCredit: 'The Bing wallpaper list failed to load; you can still upload an image.', wallpaperListFailedStatus: 'The Bing wallpaper list failed to load. You can upload an image instead.', wallpaperListReadFailed: 'Failed to read the wallpaper list', wallpaperListEmpty: 'The wallpaper list is empty',

        }
      };

      function readStoredLanguage() {
        try { return localStorage.getItem('carddesigner-language') === 'en' ? 'en' : 'zh'; }
        catch (error) { return 'zh'; }
      }

      const canvas = document.getElementById('card');
      const context = canvas.getContext('2d');
      const controls = {
        languageToggle: document.getElementById('languageToggle'),
        sizeTag: document.getElementById('sizeTag'),
        bankSize: document.getElementById('bankSize'),
        transitSize: document.getElementById('transitSize'),
        backgroundFile: document.getElementById('backgroundFile'),
        logoFile: document.getElementById('logoFile'),
        zoom: document.getElementById('zoom'),
        zoomValue: document.getElementById('zoomValue'),
        resetBackground: document.getElementById('resetBackground'),
        backgroundCredit: document.getElementById('backgroundCredit'),
        wallpaperList: document.getElementById('wallpaperList'),
        addBus: document.getElementById('addBus'),
        addMetro: document.getElementById('addMetro'),
        addText: document.getElementById('addText'),
        selectedControls: document.getElementById('selectedControls'),
        selectedTitle: document.getElementById('selectedTitle'),
        textContentField: document.getElementById('textContentField'),
        textContent: document.getElementById('textContent'),
        sizeLabel: document.getElementById('sizeLabel'),
        logoSize: document.getElementById('logoSize'),
        logoSizeValue: document.getElementById('logoSizeValue'),
        iconColorField: document.getElementById('iconColorField'),
        colorLabel: document.getElementById('colorLabel'),
        iconColor: document.getElementById('iconColor'),
        removeLogo: document.getElementById('removeLogo'),
        exportPng: document.getElementById('exportPng'),
        status: document.getElementById('status'),
        visitCounter: document.getElementById('busuanzi_page_pv')
      };
      const state = {
        width: 900, height: 567, background: null, backgroundUrl: null,
        backgroundX: 0, backgroundY: 0, zoom: 1, logos: [], selectedId: null,
        drag: null, nextId: 1, backgroundRequestId: 0, selectedWallpaperUrl: null,
        language: readStoredLanguage(), statusKey: null, statusParams: {}, backgroundCreditKey: 'initialCredit', backgroundCreditParams: {}, visitCounterKey: 'loading'
      };
      const activePointers = new Map();
      let pinch = null;

      function text(key, params = {}) {
        return messages[state.language][key].replace(/\{(\w+)\}/g, (match, name) => params[name] ?? '');
      }

      function showStatus(key, params = {}) {
        state.statusKey = key;
        state.statusParams = params;
        controls.status.textContent = text(key, params);
      }

      function updateBackgroundCredit() {
        const params = { ...state.backgroundCreditParams };
        if (state.language === 'en' && state.backgroundCreditKey === 'bingCredit') params.description = '';
        controls.backgroundCredit.textContent = text(state.backgroundCreditKey, params);
      }

      function updateWallpaperLanguage() {
        controls.wallpaperList.querySelectorAll('.wallpaper-option').forEach(option => {
          const image = option.querySelector('img');
          if (image) image.alt = text('wallpaperAlt', { date: option.dataset.date });
          option.title = state.language === 'zh' && option.dataset.description ? option.dataset.description : option.dataset.date;
        });
      }

      function applyLanguage(language) {
        state.language = language;
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        document.title = text('documentTitle');
        document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = text(element.dataset.i18n); });
        document.querySelectorAll('[data-i18n-html]').forEach(element => { element.innerHTML = text(element.dataset.i18nHtml); });
        document.querySelectorAll('[data-i18n-aria-label]').forEach(element => { element.setAttribute('aria-label', text(element.dataset.i18nAriaLabel)); });
        controls.languageToggle.textContent = text('languageToggle');
        controls.languageToggle.setAttribute('aria-label', text('languageToggleAria'));
        state.logos.filter(item => item.kind === 'text' && item.usesDefaultText).forEach(item => { item.text = text('defaultCardText'); });
        updateSelection();
        updateBackgroundCredit();
        updateWallpaperLanguage();
        if (state.statusKey) controls.status.textContent = text(state.statusKey, state.statusParams);
        if (state.visitCounterKey) controls.visitCounter.textContent = text(state.visitCounterKey);
        try { localStorage.setItem('carddesigner-language', language); } catch (error) { /* 本地存储不可用时仅保留本次选择。 */ }
        redraw();
      }

      function imageSize(image) { return { width: Math.max(1, image.naturalWidth), height: Math.max(1, image.naturalHeight) }; }

      function backgroundDimensions() {
        if (!state.background) return null;
        const source = imageSize(state.background);
        const scale = Math.max(state.width / source.width, state.height / source.height) * state.zoom;
        return { width: source.width * scale, height: source.height * scale };
      }

      function clampBackground() {
        const size = backgroundDimensions();
        if (!size) return;
        const maxX = Math.max(0, (size.width - state.width) / 2);
        const maxY = Math.max(0, (size.height - state.height) / 2);
        state.backgroundX = Math.max(-maxX, Math.min(maxX, state.backgroundX));
        state.backgroundY = Math.max(-maxY, Math.min(maxY, state.backgroundY));
      }

      function elementBounds(element, ctx = context) {
        if (element.kind === 'text') {
          ctx.save();
          ctx.font = `600 ${element.size}px Microsoft YaHei, PingFang SC, sans-serif`;
          const width = Math.max(12, ctx.measureText(element.text || '').width);
          ctx.restore();
          return { width, height: element.size * 1.25 };
        }
        if (element.kind === 'image') {
          return { width: element.size, height: element.size * element.image.naturalHeight / element.image.naturalWidth };
        }
        return { width: element.size, height: element.size };
      }

      function drawBus(ctx, color) {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.roundRect(-42, -30, 84, 57, 9);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-39, 1); ctx.lineTo(39, 1);
        ctx.moveTo(-12, -28); ctx.lineTo(-12, -1);
        ctx.moveTo(19, -28); ctx.lineTo(19, -1);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-25, 29, 7, 0, Math.PI * 2);
        ctx.arc(25, 29, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawMetro(ctx, color) {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.roundRect(-34, -38, 68, 64, 16);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-31, -6); ctx.lineTo(31, -6);
        ctx.moveTo(-23, 29); ctx.lineTo(-32, 40);
        ctx.moveTo(23, 29); ctx.lineTo(32, 40);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-19, 12, 4, 0, Math.PI * 2);
        ctx.arc(19, 12, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawLogo(ctx, logo) {
        const bounds = elementBounds(logo, ctx);
        if (logo.kind === 'image') {
          ctx.drawImage(logo.image, logo.x - bounds.width / 2, logo.y - bounds.height / 2, bounds.width, bounds.height);
          return;
        }
        if (logo.kind === 'text') {
          ctx.save();
          ctx.fillStyle = logo.color;
          ctx.font = `600 ${logo.size}px Microsoft YaHei, PingFang SC, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(logo.text, logo.x, logo.y);
          ctx.restore();
          return;
        }
        ctx.save();
        ctx.translate(logo.x, logo.y);
        ctx.scale(logo.size / 100, logo.size / 100);
        if (logo.kind === 'bus') drawBus(ctx, logo.color);
        else drawMetro(ctx, logo.color);
        ctx.restore();
      }

      function render(ctx, includeSelection) {
        ctx.clearRect(0, 0, state.width, state.height);
        ctx.fillStyle = '#e2eaf5';
        ctx.fillRect(0, 0, state.width, state.height);
        if (state.background) {
          const size = backgroundDimensions();
          ctx.drawImage(state.background,
            (state.width - size.width) / 2 + state.backgroundX,
            (state.height - size.height) / 2 + state.backgroundY,
            size.width, size.height);
        } else if (includeSelection) {
          ctx.fillStyle = '#8292a9';
          ctx.textAlign = 'center';
          ctx.font = '24px Microsoft YaHei, sans-serif';
          ctx.fillText(text('emptyCanvas'), state.width / 2, state.height / 2);
        }
        for (const logo of state.logos) drawLogo(ctx, logo);
        if (includeSelection) {
          const logo = state.logos.find(item => item.id === state.selectedId);
          if (logo) {
            const bounds = elementBounds(logo, ctx);
            ctx.strokeStyle = '#1769e8';
            ctx.lineWidth = 3;
            ctx.setLineDash([9, 7]);
            ctx.strokeRect(logo.x - bounds.width / 2 - 7, logo.y - bounds.height / 2 - 7, bounds.width + 14, bounds.height + 14);
            ctx.setLineDash([]);
          }
        }
      }

      function redraw() { render(context, true); }

      function updateSelection() {
        const logo = state.logos.find(item => item.id === state.selectedId);
        controls.selectedControls.hidden = !logo;
        if (!logo) return;
        const isText = logo.kind === 'text';
        controls.selectedTitle.textContent = text(logo.kind === 'bus' ? 'selectedBus' : logo.kind === 'metro' ? 'selectedMetro' : isText ? 'selectedText' : 'selectedLogo');
        controls.textContentField.hidden = !isText;
        controls.textContent.value = isText ? logo.text : '';
        controls.sizeLabel.textContent = text(isText ? 'textSize' : 'logoWidth');
        controls.logoSize.min = isText ? '16' : '30';
        controls.logoSize.max = isText ? '160' : '360';
        controls.logoSize.value = String(Math.round(logo.size));
        controls.logoSizeValue.textContent = `${Math.round(logo.size)} px`;
        controls.iconColorField.hidden = logo.kind === 'image';
        controls.colorLabel.textContent = text(isText ? 'textColor' : 'iconColor');
        if (logo.color) controls.iconColor.value = logo.color;
      }

      function setSize(width, height) {
        const oldWidth = state.width;
        const oldHeight = state.height;
        const sx = width / oldWidth;
        const sy = height / oldHeight;
        for (const logo of state.logos) {
          logo.x *= sx;
          logo.y *= sy;
          logo.size *= sx;
        }
        state.backgroundX *= sx;
        state.backgroundY *= sy;
        state.width = width;
        state.height = height;
        canvas.width = width;
        canvas.height = height;
        controls.sizeTag.textContent = `${width} × ${height} px`;
        controls.bankSize.classList.toggle('active', width === 900);
        controls.transitSize.classList.toggle('active', width === 960);
        clampBackground();
        updateSelection();
        redraw();
      }

      async function prepareImageFile(file) {
        const extension = file.name.split('.').pop()?.toLowerCase();
        const isSvg = file.type === 'image/svg+xml' || extension === 'svg';
        if (!isSvg) return file;

        const documentNode = new DOMParser().parseFromString(await file.text(), 'image/svg+xml');
        if (documentNode.querySelector('parsererror') || documentNode.documentElement.localName !== 'svg') {
          throw new Error('invalidSvg');
        }

        // SVG 以图片方式使用；移除可执行内容和外部资源，避免脚本运行或导出画布被污染。
        documentNode.querySelectorAll('script, foreignObject').forEach(node => node.remove());
        documentNode.querySelectorAll('*').forEach(node => {
          for (const attribute of [...node.attributes]) {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim();
            if (name.startsWith('on')) node.removeAttribute(attribute.name);
            if ((name === 'href' || name === 'xlink:href') && value && !value.startsWith('#') && !value.startsWith('data:image/')) {
              node.removeAttribute(attribute.name);
            }
          }
        });

        const root = documentNode.documentElement;
        if ((!root.hasAttribute('width') || !root.hasAttribute('height')) && root.hasAttribute('viewBox')) {
          const values = root.getAttribute('viewBox').trim().split(/[ ,]+/).map(Number);
          if (values.length === 4 && values.every(Number.isFinite) && values[2] > 0 && values[3] > 0) {
            if (!root.hasAttribute('width')) root.setAttribute('width', String(values[2]));
            if (!root.hasAttribute('height')) root.setAttribute('height', String(values[3]));
          }
        }
        return new Blob([new XMLSerializer().serializeToString(documentNode)], { type: 'image/svg+xml' });
      }

      async function loadImage(file, callback) {
        const extension = file?.name.split('.').pop()?.toLowerCase();
        const allowed = ['image/png', 'image/jpeg', 'image/webp', 'image/svg+xml'].includes(file?.type) || extension === 'svg';
        if (!file || !allowed) {
          showStatus('chooseImage');
          return;
        }
        let imageFile;
        try {
          imageFile = await prepareImageFile(file);
        } catch (error) {
          showStatus(error instanceof Error && error.message === 'invalidSvg' ? 'invalidSvg' : 'svgUnreadable');
          return;
        }
        const url = URL.createObjectURL(imageFile);
        const image = new Image();
        image.onload = () => callback(image, url);
        image.onerror = () => { URL.revokeObjectURL(url); showStatus('imageUnreadable'); };
        image.src = url;
      }

      function applyBackground(image, url, creditKey, creditParams = {}) {
        if (state.backgroundUrl) URL.revokeObjectURL(state.backgroundUrl);
        state.background = image;
        state.backgroundUrl = url;
        state.backgroundX = 0;
        state.backgroundY = 0;
        state.zoom = 1;
        state.selectedId = null;
        controls.zoom.value = '1';
        controls.zoomValue.textContent = '100%';
        state.backgroundCreditKey = creditKey;
        state.backgroundCreditParams = creditParams;
        updateBackgroundCredit();
        updateSelection();
        redraw();
      }

      function isBingImageUrl(value) {
        try {
          return /(^|\.)bing\.com$/i.test(new URL(value).hostname);
        } catch (error) {
          return false;
        }
      }

      function thumbnailUrl(value) {
        const url = new URL(value);
        url.searchParams.set('w', '320');
        url.searchParams.set('h', '180');
        url.searchParams.set('c', '4');
        return url.href;
      }

      function updateWallpaperSelection() {
        controls.wallpaperList.querySelectorAll('.wallpaper-option').forEach(option => {
          const active = option.dataset.url === state.selectedWallpaperUrl;
          option.classList.toggle('active', active);
          option.setAttribute('aria-selected', String(active));
        });
      }

      async function loadBingBackground(wallpaper) {
        const requestId = ++state.backgroundRequestId;
        showStatus('loadingBing', { date: wallpaper.date });
        try {
          if (!isBingImageUrl(wallpaper.url)) throw new Error('invalidWallpaper');
          const imageResponse = await fetch(wallpaper.url, { mode: 'cors', cache: 'force-cache' });
          if (!imageResponse.ok) throw new Error('wallpaperDownloadFailed');
          const blob = await imageResponse.blob();
          if (!blob.type.startsWith('image/')) throw new Error('invalidWallpaperFormat');
          const url = URL.createObjectURL(blob);
          const image = new Image();
          image.onload = () => {
            if (requestId !== state.backgroundRequestId) {
              URL.revokeObjectURL(url);
              return;
            }
            state.selectedWallpaperUrl = wallpaper.url;
            applyBackground(image, url, 'bingCredit', { date: wallpaper.date, description: wallpaper.desc ? ` · ${wallpaper.desc}` : '' });
            updateWallpaperSelection();
            showStatus('wallpaperLoaded', { date: wallpaper.date });
          };
          image.onerror = () => {
            URL.revokeObjectURL(url);
            if (requestId === state.backgroundRequestId) showStatus('wallpaperUnreadable');
          };
          image.src = url;
        } catch (error) {
          if (requestId !== state.backgroundRequestId) return;
          showStatus('wallpaperLoadFailed');
        }
      }

      function renderWallpaperList(wallpapers) {
        controls.wallpaperList.replaceChildren();
        for (const [index, wallpaper] of wallpapers.entries()) {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'wallpaper-option';
          option.dataset.url = wallpaper.url;
          option.dataset.date = wallpaper.date;
          option.dataset.description = wallpaper.desc;
          option.setAttribute('role', 'option');
          option.setAttribute('aria-selected', 'false');
          option.title = state.language === 'zh' && wallpaper.desc ? wallpaper.desc : wallpaper.date;

          const image = document.createElement('img');
          image.src = thumbnailUrl(wallpaper.url);
          image.alt = text('wallpaperAlt', { date: wallpaper.date });
          image.loading = index < 4 ? 'eager' : 'lazy';
          image.decoding = 'async';

          const date = document.createElement('span');
          date.textContent = wallpaper.date;
          option.append(image, date);
          option.addEventListener('click', () => loadBingBackground(wallpaper));
          controls.wallpaperList.append(option);
        }
      }

      async function loadBingWallpapers() {
        try {
          // 中文区首页由 bing.wdbyte.com 的开源仓库每日更新；raw 地址允许静态页面跨域读取。
          const response = await fetch('https://raw.githubusercontent.com/niumoo/bing-wallpaper/main/docs/zh-cn/index.html', { cache: 'no-store' });
          if (!response.ok) throw new Error('wallpaperListReadFailed');
          const page = new DOMParser().parseFromString(await response.text(), 'text/html');
          const wallpapers = [...page.querySelectorAll('.bing-download')].map(link => ({
            url: link.getAttribute('href') || '',
            date: link.dataset.date || '',
            desc: link.dataset.desc || ''
          })).filter(item => item.date && isBingImageUrl(item.url)).slice(0, 30);
          if (!wallpapers.length) throw new Error('wallpaperListEmpty');
          renderWallpaperList(wallpapers);
          loadBingBackground(wallpapers[0]);
        } catch (error) {
          const status = document.createElement('p');
          status.className = 'wallpaper-list-status';
          status.dataset.i18n = 'wallpaperListFailed';
          status.textContent = text('wallpaperListFailed');
          controls.wallpaperList.replaceChildren(status);
          state.backgroundCreditKey = 'wallpaperListFailedCredit';
          state.backgroundCreditParams = {};
          updateBackgroundCredit();
          showStatus('wallpaperListFailedStatus');
        }
      }

      function initializeVisitCounter() {
        const value = controls.visitCounter;
        const isPublishedPage = /^https?:$/.test(location.protocol) && !['localhost', '127.0.0.1'].includes(location.hostname);
        if (!isPublishedPage) {
          state.visitCounterKey = 'publishedOnly';
          value.textContent = text('publishedOnly');
          return;
        }

        const script = document.createElement('script');
        script.src = 'https://cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js';
        script.defer = true;
        script.onload = () => { state.visitCounterKey = null; };
        script.onerror = () => { state.visitCounterKey = 'unavailable'; value.textContent = text('unavailable'); };
        document.head.append(script);
      }

      function addLogo(kind, image, url) {
        const logo = { id: state.nextId++, kind, x: state.width / 2, y: state.height / 2, size: kind === 'image' ? 150 : 110, color: '#ffffff', image, url };
        state.logos.push(logo);
        state.selectedId = logo.id;
        updateSelection();
        redraw();
      }

      function addText() {
        const textElement = { id: state.nextId++, kind: 'text', x: state.width / 2, y: state.height / 2, size: 52, color: '#ffffff', text: text('defaultCardText'), usesDefaultText: true };
        state.logos.push(textElement);
        state.selectedId = textElement.id;
        updateSelection();
        redraw();
        controls.textContent.focus();
        controls.textContent.select();
      }

      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: (event.clientX - rect.left) * state.width / rect.width, y: (event.clientY - rect.top) * state.height / rect.height };
      }

      function logoAt(point) {
        for (let i = state.logos.length - 1; i >= 0; i--) {
          const logo = state.logos[i];
          const bounds = elementBounds(logo);
          if (Math.abs(point.x - logo.x) <= bounds.width / 2 + 8 && Math.abs(point.y - logo.y) <= bounds.height / 2 + 8) return logo;
        }
        return null;
      }

      function pointerCenter(points) {
        return { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
      }

      function pointerDistance(points) {
        return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
      }

      controls.bankSize.addEventListener('click', () => setSize(900, 567));
      controls.transitSize.addEventListener('click', () => setSize(960, 606));
      controls.backgroundFile.addEventListener('change', event => {
        const requestId = ++state.backgroundRequestId;
        loadImage(event.target.files[0], (image, url) => {
          if (requestId !== state.backgroundRequestId) {
            URL.revokeObjectURL(url);
            return;
          }
          state.selectedWallpaperUrl = null;
          applyBackground(image, url, 'manualCredit');
          updateWallpaperSelection();
          showStatus('backgroundLoaded');
        });
        event.target.value = '';
      });
      controls.logoFile.addEventListener('change', event => {
        loadImage(event.target.files[0], (image, url) => { addLogo('image', image, url); showStatus('logoAdded'); });
        event.target.value = '';
      });
      controls.zoom.addEventListener('input', event => {
        state.zoom = Number(event.target.value);
        controls.zoomValue.textContent = `${Math.round(state.zoom * 100)}%`;
        clampBackground();
        redraw();
      });
      controls.resetBackground.addEventListener('click', () => {
        state.backgroundX = 0;
        state.backgroundY = 0;
        state.zoom = 1;
        controls.zoom.value = '1';
        controls.zoomValue.textContent = '100%';
        redraw();
      });
      controls.addBus.addEventListener('click', () => addLogo('bus'));
      controls.addMetro.addEventListener('click', () => addLogo('metro'));
      controls.addText.addEventListener('click', addText);
      controls.textContent.addEventListener('input', event => {
        const logo = state.logos.find(item => item.id === state.selectedId);
        if (!logo || logo.kind !== 'text') return;
        logo.text = event.target.value;
        logo.usesDefaultText = false;
        redraw();
      });
      controls.logoSize.addEventListener('input', event => {
        const logo = state.logos.find(item => item.id === state.selectedId);
        if (!logo) return;
        logo.size = Number(event.target.value);
        controls.logoSizeValue.textContent = `${Math.round(logo.size)} px`;
        redraw();
      });
      controls.iconColor.addEventListener('input', event => {
        const logo = state.logos.find(item => item.id === state.selectedId);
        if (!logo || logo.kind === 'image') return;
        logo.color = event.target.value;
        redraw();
      });
      controls.removeLogo.addEventListener('click', () => {
        const index = state.logos.findIndex(item => item.id === state.selectedId);
        if (index < 0) return;
        const [logo] = state.logos.splice(index, 1);
        if (logo.url) URL.revokeObjectURL(logo.url);
        state.selectedId = null;
        updateSelection();
        redraw();
      });

      canvas.addEventListener('pointerdown', event => {
        const point = pointFromEvent(event);
        if (activePointers.size >= 2) return;
        activePointers.set(event.pointerId, point);
        canvas.setPointerCapture(event.pointerId);
        canvas.classList.add('dragging');

        if (activePointers.size === 2 && state.background) {
          const points = [...activePointers.values()];
          pinch = {
            distance: Math.max(1, pointerDistance(points)),
            center: pointerCenter(points),
            zoom: state.zoom,
            backgroundX: state.backgroundX,
            backgroundY: state.backgroundY
          };
          state.drag = null;
          return;
        }

        const logo = logoAt(point);
        state.selectedId = logo ? logo.id : null;
        state.drag = { pointerId: event.pointerId, x: point.x, y: point.y, logoId: logo ? logo.id : null };
        updateSelection();
        redraw();
      });
      canvas.addEventListener('pointermove', event => {
        if (!activePointers.has(event.pointerId)) return;
        const point = pointFromEvent(event);
        activePointers.set(event.pointerId, point);

        if (pinch && activePointers.size === 2 && state.background) {
          const points = [...activePointers.values()];
          const center = pointerCenter(points);
          const nextZoom = Math.max(1, Math.min(4, pinch.zoom * pointerDistance(points) / pinch.distance));
          const scale = nextZoom / pinch.zoom;
          state.zoom = nextZoom;
          state.backgroundX = center.x - state.width / 2 - (pinch.center.x - state.width / 2 - pinch.backgroundX) * scale;
          state.backgroundY = center.y - state.height / 2 - (pinch.center.y - state.height / 2 - pinch.backgroundY) * scale;
          controls.zoom.value = String(state.zoom);
          controls.zoomValue.textContent = `${Math.round(state.zoom * 100)}%`;
          clampBackground();
          redraw();
          return;
        }

        if (!state.drag || state.drag.pointerId !== event.pointerId) return;
        const dx = point.x - state.drag.x;
        const dy = point.y - state.drag.y;
        if (state.drag.logoId) {
          const logo = state.logos.find(item => item.id === state.drag.logoId);
          if (logo) {
            logo.x = Math.max(0, Math.min(state.width, logo.x + dx));
            logo.y = Math.max(0, Math.min(state.height, logo.y + dy));
          }
        } else if (state.background) {
          state.backgroundX += dx;
          state.backgroundY += dy;
          clampBackground();
        }
        state.drag.x = point.x;
        state.drag.y = point.y;
        redraw();
      });
      function endDrag(event) {
        if (!activePointers.has(event.pointerId)) return;
        activePointers.delete(event.pointerId);
        if (pinch) {
          pinch = null;
          if (activePointers.size === 1) {
            const [pointerId, point] = activePointers.entries().next().value;
            state.drag = { pointerId, x: point.x, y: point.y, logoId: null };
          } else {
            state.drag = null;
            canvas.classList.remove('dragging');
          }
          return;
        }
        if (state.drag && state.drag.pointerId === event.pointerId) {
          state.drag = null;
          canvas.classList.remove('dragging');
        }
      }
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('wheel', event => {
        if (!state.background) return;
        event.preventDefault();
        state.zoom = Math.max(1, Math.min(4, state.zoom + (event.deltaY < 0 ? 0.05 : -0.05)));
        controls.zoom.value = String(state.zoom);
        controls.zoomValue.textContent = `${Math.round(state.zoom * 100)}%`;
        clampBackground();
        redraw();
      }, { passive: false });
      document.addEventListener('keydown', event => {
        if ((event.key === 'Delete' || event.key === 'Backspace') && state.selectedId && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
          event.preventDefault();
          controls.removeLogo.click();
        }
      });

      controls.languageToggle.addEventListener('click', () => {
        applyLanguage(state.language === 'zh' ? 'en' : 'zh');
      });

      controls.exportPng.addEventListener('click', () => {
        if (!state.background) { showStatus('uploadFirst'); return; }
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = state.width;
        exportCanvas.height = state.height;
        render(exportCanvas.getContext('2d'), false);
        try {
          exportCanvas.toBlob(blob => {
            if (!blob) { showStatus('exportFailed'); return; }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = text('exportFilename', { width: state.width, height: state.height });
            document.body.append(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 60000);
            showStatus('exported', { width: state.width, height: state.height });
          }, 'image/png');
        } catch (error) {
          showStatus('exportSvgFailed');
        }
      });

      applyLanguage(state.language);
      loadBingWallpapers();
      initializeVisitCounter();
    })();
  </script>
