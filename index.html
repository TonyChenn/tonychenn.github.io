<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="默然的个人导航小站，快速前往云桌面、博客和 Games。">
  <meta name="theme-color" content="#f6f7fb">
  <meta property="og:title" content="默然的小站">
  <meta property="og:description" content="心有猛虎，细嗅蔷薇。欢迎来到默然的个人导航小站。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tonychenn.cn/">
  <link rel="canonical" href="https://tonychenn.cn/">
  <link rel="icon" href="icon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <title>默然的小站</title>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <p class="eyebrow" aria-hidden="true">PERSONAL PORTAL</p>
      <h1>默然的小站</h1>
      <p class="tagline">心有猛虎 <span aria-hidden="true">&amp;</span><span class="sr-only">，</span> 细嗅蔷薇</p>
    </header>

    <main class="portal" aria-label="站点导航">
      <!--desktop-->
      <a class="portal-card project-card desktop-card" href="https://desktop.tonychenn.cn/" target="_blank" rel="noopener noreferrer">
        <span class="icon-wrap icon-wrap-blue" aria-hidden="true">
          <img src="icon/desktop.svg" width="64" height="64" alt="">
        </span>
        <span class="card-copy">
          <span class="card-title">云桌面</span>
          <span class="card-description">随时连接工作空间</span>
          <span class="sr-only">（在新标签页打开）</span>
        </span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>

      <!--blog-->
      <a class="portal-card project-card blog-card" href="https://blog.tonychenn.cn/" target="_blank" rel="noopener noreferrer">
        <span class="icon-wrap icon-wrap-rose" aria-hidden="true">
          <img src="icon/blog.svg" width="64" height="64" alt="">
        </span>
        <span class="card-copy">
          <span class="card-title">博客</span>
          <span class="card-description">记录思考与技术</span>
          <span class="sr-only">（在新标签页打开）</span>
        </span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>

      <div class="portal-card scene-card garden-scene" aria-hidden="true">
        <!--sun-->
        <span class="scene-sun"></span>
        <span class="scene-cloud scene-cloud-left"></span>
        <span class="scene-cloud scene-cloud-right"></span>
        <!--tree-->
        <span class="tree tree-small"><span class="tree-crown"></span><span class="tree-trunk"></span></span>
        <span class="tree tree-large"><span class="tree-crown"></span><span class="tree-trunk"></span></span>
        <span class="scene-ground"></span>
      </div>

      <!--park-->
      <div class="portal-card scene-card park-scene" aria-hidden="true">
        <img src="icon/park.svg" width="360" height="160" alt="">
      </div>

      <!--cocos-editor-->
      <a class="portal-card project-card cocos-editor-card" href="https://github.com/TonyChenn/CocosEditor-Releases" target="_blank" rel="noopener noreferrer">
        <span class="icon-wrap icon-wrap-teal" aria-hidden="true">
          <img src="icon/cocos-editor.svg" width="64" height="64" alt="">
        </span>
        <span class="card-copy">
          <span class="card-title">CocosEditor</span>
          <span class="card-description">Unity-style 的 Cocos2d-x 运行时编辑器</span>
          <span class="sr-only">（在新标签页打开）</span>
        </span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>

      <!--games-->
      <a class="portal-card project-card games-card" href="https://game.tonychenn.cn/" target="_blank" rel="noopener noreferrer">
        <span class="icon-wrap icon-wrap-amber" aria-hidden="true">
          <img src="icon/groot.svg" width="64" height="64" alt="">
        </span>
        <span class="card-copy">
          <span class="card-title">Games</span>
          <span class="card-description">轻松一下，玩点游戏</span>
          <span class="sr-only">（在新标签页打开）</span>
        </span>
        <span class="card-arrow" aria-hidden="true">↗</span>
      </a>

      <!--waiting-->
      <!--
        #ffe60f
        #fd7403
        #363636
      -->
    </main>
  </div>
</body>
</html>
